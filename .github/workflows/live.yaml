name: LIVE - Build & Deploy Mindstream (PM2 cluster x4)

on: workflow_dispatch

env:
  PRJ: mindstream
  APP_DIR: /home/${{ vars.USER }}/app/mindstream
  PM2_APP: mindstream-web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install production dependencies
        run: |
          npm install --omit=optional
          npm prune --omit=dev

      - name: Build deployment archive
        run: |
          zip -qq --exclude=*.git* -r ${{ env.PRJ }}.zip ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-archive
          path: ${{ env.PRJ }}.zip
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-archive
          path: .

      - name: Copy archive to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ${{ env.PRJ }}.zip
          target: ${{ env.APP_DIR }}

      - name: Deploy via PM2 (cluster x4)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd "${{ env.APP_DIR }}"

            rm -rf prod.new
            mkdir -p prod.new

            unzip -qq "${{ env.PRJ }}.zip" -d prod.new

            source ~/.nvm/nvm.sh
            nvm use node

            TIMESTAMP=$(date +%Y%m%d-%H%M%S)

            # Create and validate a PostgreSQL backup before stopping the old runtime.
            # The first deployment has no previous .env and therefore has no database
            # configuration available on the server yet.
            BACKUP_DIR="${{ env.APP_DIR }}/var/backups/postgresql"
            BACKUP_ENV="${{ env.APP_DIR }}/prod/.env"
            if [ -d "${{ env.APP_DIR }}/prod" ]; then
              if [ ! -f "$BACKUP_ENV" ]; then
                echo "Cannot create a database backup: deployed .env is missing."
                exit 1
              fi

              command -v pg_dump >/dev/null
              command -v pg_restore >/dev/null

              set -a
              . "$BACKUP_ENV"
              set +a

              : "${TEQFW_DB__DATABASE:?TEQFW_DB__DATABASE is required for deployment backup}"
              : "${TEQFW_DB__USER:?TEQFW_DB__USER is required for deployment backup}"

              mkdir -p "$BACKUP_DIR"
              chmod 700 "$BACKUP_DIR"
              BACKUP_FILE="$BACKUP_DIR/${{ env.PRJ }}_${TIMESTAMP}.dump"

              PGPASSWORD="${TEQFW_DB__PASSWORD:-}" pg_dump \
                --format=custom \
                --host="${TEQFW_DB__HOST:-localhost}" \
                --port="${TEQFW_DB__PORT:-5432}" \
                --username="$TEQFW_DB__USER" \
                --file="$BACKUP_FILE" \
                "$TEQFW_DB__DATABASE"
              pg_restore --list "$BACKUP_FILE" >/dev/null

              # Keep the most recent 30 days of deployment backups.
              find "$BACKUP_DIR" -type f -name '${{ env.PRJ }}_*.dump' -mtime +30 -delete
              echo "PostgreSQL backup created and validated: $BACKUP_FILE"
            else
              echo "No previous deployment found; PostgreSQL backup is not required."
            fi

            # Stop previous runtime if exists
            pm2 stop "${{ env.PM2_APP }}" || true
            pm2 delete "${{ env.PM2_APP }}" || true

            # Rotate directories (first deploy safe)
            rm -rf prod.old
            if [ -d prod ]; then
              mv prod prod.old
            else
              mkdir -p prod.old
            fi

            mv prod.new prod

            # Restore configuration and runtime data (only if exist)
            if [ -f prod.old/.env ]; then
              cp prod.old/.env prod/.env
            fi

            if [ -d prod.old/var ]; then
              mkdir -p prod/var
              cp -a prod.old/var/. prod/var/ || true
            fi

            # Start the default fl32:web:start command in PM2 cluster mode (4 workers)
            cd "${{ env.APP_DIR }}/prod"
            pm2 start ./node_modules/.bin/teq \
              --name mindstream-web \
              -i 4

            pm2 save
            
            cd "${{ env.APP_DIR }}"
            mv "${{ env.PRJ }}.zip" "${{ env.PRJ }}-${TIMESTAMP}.zip"

            echo "Mindstream deployed successfully (PM2 cluster x4)"
            pm2 ls
            ls -lh "${{ env.APP_DIR }}"
