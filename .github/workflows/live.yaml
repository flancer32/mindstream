name: LIVE - Build & Deploy Mindstream (PM2 cluster x4)

on:
  workflow_dispatch:
    inputs:
      activate_migrated_database:
        description: Configure the release for the completed DEM-RDB migration
        type: boolean
        default: false

concurrency:
  group: mindstream-production
  cancel-in-progress: false

env:
  PRJ: mindstream
  APP_DIR: /home/${{ vars.USER }}/app/mindstream
  PM2_APP: mindstream-web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install production dependencies
        run: |
          npm install --omit=optional
          npm prune --omit=dev

      - name: Build deployment archive
        run: |
          zip -qq --exclude=*.git* -r ${{ env.PRJ }}.zip ./

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-archive
          path: ${{ env.PRJ }}.zip
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-archive
          path: .

      - name: Copy archive to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ${{ env.PRJ }}.zip
          target: ${{ env.APP_DIR }}

      - name: Deploy via PM2 (cluster x4)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd "${{ env.APP_DIR }}"

            rm -rf prod.new
            mkdir -p prod.new

            unzip -qq "${{ env.PRJ }}.zip" -d prod.new

            source ~/.nvm/nvm.sh
            nvm use node

            TIMESTAMP=$(date +%Y%m%d-%H%M%S)

            # Create a PostgreSQL backup and check its archive catalog before stopping the old runtime.
            # The first deployment has no previous .env and therefore has no database
            # configuration available on the server yet.
            BACKUP_DIR="${{ env.APP_DIR }}/var/backups/postgresql"
            BACKUP_ENV="${{ env.APP_DIR }}/prod/.env"
            if [ -d "${{ env.APP_DIR }}/prod" ]; then
              if [ ! -f "$BACKUP_ENV" ]; then
                echo "Cannot create a database backup: deployed .env is missing."
                exit 1
              fi

              command -v pg_dump >/dev/null
              command -v pg_restore >/dev/null

              set -a
              . "$BACKUP_ENV"
              set +a

              # The previous release may still use the legacy database configuration.
              DB_CONFIG=TEQFW_DEM_RDB
              if [ -z "${TEQFW_DEM_RDB__DATABASE:-}${TEQFW_DEM_RDB__USER:-}" ]; then
                DB_CONFIG=TEQFW_DB
              fi
              DB_NAME_KEY="${DB_CONFIG}__DATABASE"
              DB_USER_KEY="${DB_CONFIG}__USER"
              DB_HOST_KEY="${DB_CONFIG}__HOST"
              DB_PORT_KEY="${DB_CONFIG}__PORT"
              DB_PASSWORD_KEY="${DB_CONFIG}__PASSWORD"
              : "${!DB_NAME_KEY:?Database name is required for deployment backup}"
              : "${!DB_USER_KEY:?Database user is required for deployment backup}"

              if [ "${{ inputs.activate_migrated_database }}" = true ]; then
                BACKUP_FILE=$(cat "$BACKUP_DIR/mindstream-dem-rdb.completed")
                case "$BACKUP_FILE" in
                  "$BACKUP_DIR"/mindstream-pre-dem-rdb.*.dump) ;;
                  *) echo 'Invalid migration backup path.' >&2; exit 1 ;;
                esac
                pg_restore --list "$BACKUP_FILE" >/dev/null
                echo "Using the verified backup from the completed migration: $BACKUP_FILE"
              else
                mkdir -p "$BACKUP_DIR"
                chmod 700 "$BACKUP_DIR"
                BACKUP_FILE="$BACKUP_DIR/${{ env.PRJ }}_${TIMESTAMP}.dump"

                PGPASSWORD="${!DB_PASSWORD_KEY:-}" pg_dump \
                  --format=custom \
                  --host="${!DB_HOST_KEY:-localhost}" \
                  --port="${!DB_PORT_KEY:-5432}" \
                  --username="${!DB_USER_KEY}" \
                  --file="$BACKUP_FILE" \
                  "${!DB_NAME_KEY}"
                pg_restore --list "$BACKUP_FILE" >/dev/null

                # Keep the most recent 30 days of deployment backups.
                find "$BACKUP_DIR" -type f -name '${{ env.PRJ }}_*.dump' -mtime +30 -delete
                echo "PostgreSQL backup created and archive catalog checked: $BACKUP_FILE"
              fi
            else
              echo "No previous deployment found; PostgreSQL backup is not required."
            fi

            if [ "${{ inputs.activate_migrated_database }}" = true ]; then
              test -s "$BACKUP_DIR/mindstream-dem-rdb.completed"
              export CUTOVER_DB_CONFIG=TEQFW_DB
              if [ -z "${TEQFW_DB__DATABASE:-}${TEQFW_DB__USER:-}" ]; then
                export CUTOVER_DB_CONFIG=TEQFW_DEM_RDB
              fi
              install -m 600 "$BACKUP_ENV" prod.new/.env
              node --input-type=module <<'JS' >> prod.new/.env
            const prefix = process.env.CUTOVER_DB_CONFIG;
            const read = (key) => process.env[`${prefix}__${key}`];
            const settings = {
              CLIENT: 'pg',
              DATABASE: read('DATABASE'),
              USER: read('USER'),
              HOST: read('HOST') || 'localhost',
              PORT: read('PORT') || '5432',
              PASSWORD: read('PASSWORD') ?? '',
              SEARCH_PATH: 'mindstream_data,public',
            };
            if (settings.DATABASE !== 'mindstream' || !settings.USER) {
              throw new Error('The migration database configuration is incomplete.');
            }
            for (const value of Object.values(settings)) {
              if (/[\r\n']/.test(value)) {
                throw new Error('A database setting cannot be written as a single-quoted dotenv value.');
              }
            }
            process.stdout.write('\n' + Object.entries(settings)
              .map(([key, value]) => `TEQFW_DEM_RDB__${key}='${value}'\n`).join(''));
            JS
              set -a
              . ./prod.new/.env
              set +a
              PGPASSWORD="$TEQFW_DEM_RDB__PASSWORD" PGOPTIONS='-c default_transaction_read_only=on' \
                psql -Xw --set=ON_ERROR_STOP=1 \
                --host="$TEQFW_DEM_RDB__HOST" --port="$TEQFW_DEM_RDB__PORT" \
                --username="$TEQFW_DEM_RDB__USER" --dbname="$TEQFW_DEM_RDB__DATABASE" \
                --command='SELECT count(*) AS migrated_publications FROM mindstream_data.mindstream_publication'
            fi

            # Stop previous runtime if exists
            pm2 stop "${{ env.PM2_APP }}" || true
            pm2 delete "${{ env.PM2_APP }}" || true

            # Rotate directories (first deploy safe)
            rm -rf prod.old
            if [ -d prod ]; then
              mv prod prod.old
            else
              mkdir -p prod.old
            fi

            mv prod.new prod

            # Restore configuration and runtime data (only if exist)
            if [ -f prod.old/.env ] && [ ! -f prod/.env ]; then
              cp prod.old/.env prod/.env
            fi

            if [ -d prod.old/var ]; then
              mkdir -p prod/var
              cp -a prod.old/var/. prod/var/ || true
            fi

            # Start the default web:start command in PM2 cluster mode (4 workers)
            cd "${{ env.APP_DIR }}/prod"
            pm2 start ./node_modules/.bin/teq \
              --name mindstream-web \
              -i 4

            pm2 save
            
            cd "${{ env.APP_DIR }}"
            mv "${{ env.PRJ }}.zip" "${{ env.PRJ }}-${TIMESTAMP}.zip"

            echo "Mindstream deployed successfully (PM2 cluster x4)"
            pm2 ls
            ls -lh "${{ env.APP_DIR }}"

            if [ "${{ inputs.activate_migrated_database }}" = true ]; then
              crontab -l 2>/dev/null | awk '
                /^# DEM-RDB maintenance: / {
                  if (match($0, /(ingest|process):[[:alnum:]_-]+(:[[:alnum:]_-]+)*/)) {
                    print "Paused Mindstream command: " substr($0, RSTART, RLENGTH)
                  } else {
                    unknown++
                  }
                }
                END { if (unknown) print "Paused Mindstream entries requiring manual review: " unknown }
              '
            fi
