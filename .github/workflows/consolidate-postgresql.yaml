name: LIVE - Consolidate PostgreSQL into public once

on:
  workflow_dispatch:
    inputs:
      maintenance_confirmed:
        description: Run the PostgreSQL cutover in the confirmed production maintenance window
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: mindstream-production
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.ref == 'refs/heads/main' && inputs.maintenance_confirmed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_DIR: /home/${{ vars.USER }}/app/mindstream
      ARCHIVE: mindstream-consolidation-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Package the cutover scripts
        run: tar -czf "$ARCHIVE" -C .github/scripts consolidate-postgresql.sh consolidate-postgresql.sql

      - name: Upload the scripts
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: ${{ env.ARCHIVE }}
          target: ${{ env.APP_DIR }}/var/migration

      - name: Run the cutover on the production host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 45m
          script: |
            set -eu
            umask 077
            app_dir="${{ env.APP_DIR }}"
            archive="$app_dir/var/migration/${{ env.ARCHIVE }}"
            scripts=$(mktemp -d "$app_dir/var/migration/consolidation.XXXXXXXX")
            trap 'rm -- "$scripts/consolidate-postgresql.sh" "$scripts/consolidate-postgresql.sql" "$archive"; rmdir -- "$scripts"' EXIT
            tar -xzf "$archive" -C "$scripts"
            bash "$scripts/consolidate-postgresql.sh" "$app_dir"
